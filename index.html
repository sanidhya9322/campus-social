<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Campus Social 🚀 | The Ultimate Student Network</title>
    
    <!-- Search Engine Description -->
    <meta name="description" content="Campus Social is the ultimate student network. Explore trending discussions, join campus clubs, discover events, play Daily Match, buy/sell items, and find freelance campus gigs.">
    <meta name="keywords" content="campus social, social campus, college network, student clubs, campus events, daily match, campus gigs, student marketplace R.V. parankar collage arvi, rv parankar colage arvi">
    <meta name="google-site-verification" content="GYvUlvuSX0y99XzuTl_tMWBz0XkXHfcEdqSfaJNbX6o" />

    <!-- Open Graph (Updated to your official .in domain) -->
    <meta property="og:title" content="Campus Social 🚀 | The Ultimate Student Network">
    <meta property="og:description" content="Trending posts, Clubs, Events, Gigs, and Daily Match. Join your exclusive campus ecosystem.">
    <meta property="og:url" content="https://campussocial.in/">
    <meta property="og:image" content="https://campussocial.in/icons/icon-512x512.png">

    <!-- App Assets -->
    <link rel="stylesheet" href="dashboard.css"> <!-- Design System Variables -->
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/icons/favicon.png">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <link rel="manifest" href="manifest.json">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: var(--bg-color);">

    <div class="landing-container" style="display: flex; flex-wrap: wrap; max-width: 1000px; width: 100%; padding: 20px; gap: 40px; align-items: center; justify-content: space-between;">
        
        <!-- Left Side: Branding -->
        <div class="branding-section" style="flex: 1; min-width: 300px;">
            <h1 style="color: var(--primary); font-size: 3.5rem; margin-bottom: 10px; font-weight: 700; letter-spacing: -1px;">Campus Social 🚀</h1>
            <p style="font-size: 1.25rem; color: var(--text-main); margin-bottom: 25px; font-weight: 500;">Connect with your college. No fake profiles, just real students.</p>
            <ul style="list-style: none; padding: 0; font-size: 1.1rem; color: var(--text-muted); line-height: 2;">
                <li><span style="margin-right: 10px;">🔥</span> See what's trending on campus</li>
                <li><span style="margin-right: 10px;">🛒</span> Buy & sell in the student marketplace</li>
                <li><span style="margin-right: 10px;">📅</span> Never miss a college event</li>
                <li><span style="margin-right: 10px;">👥</span> Join clubs and communities</li>
            </ul>
        </div>

        <!-- Right Side: Login Box -->
        <div class="login-box modern-card" style="flex: 1; min-width: 320px; max-width: 420px; padding: 40px;">
            <h2 style="margin-top: 0; color: var(--text-main); font-weight: 700; font-size: 28px; margin-bottom: 25px;">Student Access</h2>
            
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <input type="email" id="email-input" placeholder="College Email ID" style="padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 16px; background-color: var(--bg-color); outline: none; font-family: inherit;">
                <input type="password" id="password-input" placeholder="Password" style="padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 16px; background-color: var(--bg-color); outline: none; font-family: inherit;">
            </div>
            
            <p id="auth-msg" style="color: #e11d48; margin-top: 10px; font-size: 14px; display: none; font-weight: 600;"></p>

            <div style="display: flex; gap: 12px; margin-top: 25px;">
                <button id="login-btn" style="flex: 1; padding: 14px; background-color: var(--primary); color: white; border: none; border-radius: var(--radius-full); font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s ease;">Login</button>
                <button id="signup-btn" style="flex: 1; padding: 14px; background-color: #10b981; color: white; border: none; border-radius: var(--radius-full); font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s ease;">Sign Up</button>
            </div>

            <div style="margin-top: 20px; text-align: center;">
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 15px;">or</p>
                <button id="google-login-btn" class="google-btn" style="width: 100%; padding: 14px; background-color: var(--surface); color: var(--text-main); border: 1px solid var(--border); border-radius: var(--radius-full); font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); transition: transform 0.1s ease;">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" style="margin-right: 10px;">
                    Continue with Google
                </button>
            </div>
        </div>
    </div>
    
    <script type="module" src="script.js?v=2"></script>
    <script src="pwa-engine.js"></script>
</body>
</html>
