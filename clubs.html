<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clubs & Communities - Campus Social</title>
    <link rel="stylesheet" href="dashboard.css">
    
    <!-- Browser Tab Favicon -->
    <link rel="icon" type="image/png" href="/icons/favicon.png">
    <!-- iPhone/iPad App Icon Support -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <nav class="navbar">
        <h2>Campus Social 👥</h2>
        <div style="display: flex; gap: 12px;">
            <button onclick="window.location.href='dashboard.html'" style="background-color: var(--text-muted);">Back to Home</button>
            <button id="logout-btn">Logout</button>
        </div>
    </nav>

    <div class="container">
        
        <!-- 1. LEFT COLUMN: Universal Sidebar Navigation -->
        <aside class="sidebar">
            <ul>
                <li onclick="window.location.href='dashboard.html'">🏠 Home</li>
                <li onclick="window.location.href='trending.html'">🔥 Trending</li>
                <li onclick="window.location.href='clubs.html'" style="color: var(--primary); background: var(--bg-color);">👥 Clubs & Communities</li>
                <li onclick="window.location.href='marketplace.html'">🛒 Marketplace</li>
                <li onclick="window.location.href='events.html'">📅 Campus Events</li>
                <li onclick="window.location.href='match.html'">🎲 Daily Match</li>
                <li onclick="window.location.href='gigs.html'">💼 Campus Gigs</li>
                <li onclick="window.location.href='myprofile.html'">👤 My Profile</li>
            </ul>
        </aside>

        <!-- 2. MIDDLE COLUMN: Club Specific Feed -->
        <main class="feed">
            <div class="create-post modern-card">
                <h3 id="active-club-title" style="margin-top: 0; color: var(--primary); font-weight: 700;">💻 Coding Club</h3>
                <textarea id="club-post-input" placeholder="Start a discussion in this club..." required></textarea>
                <button id="club-post-btn" style="width: 100%;">Post to Club</button>
            </div>

            <h3 style="margin-top: 20px; color: var(--text-main); font-weight: 700;">Club Discussions</h3>
            <div id="club-live-posts" style="display: flex; flex-direction: column; gap: 15px;"></div>
        </main>

        <!-- 3. RIGHT COLUMN: Club Selector Widget -->
        <aside class="right-sidebar">
            
            <div class="widget modern-card">
                <h3 style="margin-top: 0; color: var(--text-main); font-weight: 700;">📌 Select a Club</h3>
                <ul id="club-list" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px;">
                    <li class="club-option" data-club="Coding Club" style="background: var(--bg-color); color: var(--primary); padding: 12px; border-radius: var(--radius-md); cursor: pointer; font-weight: 600; border: 1px solid var(--border);">💻 Coding Club</li>
                    
                    <li class="club-option" data-club="Cultural Club" style="padding: 12px; border-radius: var(--radius-md); cursor: pointer; font-weight: 600; border: 1px solid transparent; transition: background 0.2s;">🎭 Cultural Club</li>
                    
                    <li class="club-option" data-club="Sports Club" style="padding: 12px; border-radius: var(--radius-md); cursor: pointer; font-weight: 600; border: 1px solid transparent; transition: background 0.2s;">🏏 Sports Club</li>
                </ul>
            </div>

        </aside>

    </div>

    <script type="module" src="clubs.js"></script>
    <script src="pwa-engine.js"></script>
</body>
</html>
