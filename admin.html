<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control | Campus Social</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="icon" type="image/png" href="/icons/favicon.png">
</head>
<body style="background-color: #f8fafc;">
    <nav class="navbar" style="background: #1e293b; color: white;">
        <h2>Campus Social 🛡️ <span style="font-size: 14px; color: #10b981;">Admin Panel</span></h2>
        <div>
            <button onclick="window.location.href='dashboard.html'" style="background: #334155; color: white;">App Home</button>
            <button id="logout-btn" style="background: #e11d48; color: white;">Logout</button>
        </div>
    </nav>

    <div class="container" style="max-width: 1200px; grid-template-columns: 1fr;">
        
        <main class="feed" style="width: 100%;">
            
            <!-- 1. Stats Overview -->
            <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                <div class="modern-card" style="flex: 1; text-align: center; border-bottom: 5px solid #3b82f6;">
                    <h3 style="color: var(--text-muted); margin-top: 0;">Total Users</h3>
                    <h1 id="stat-users" style="margin: 0; color: #3b82f6; font-size: 36px;">...</h1>
                </div>
                <div class="modern-card" style="flex: 1; text-align: center; border-bottom: 5px solid #e11d48;">
                    <h3 style="color: var(--text-muted); margin-top: 0;">Active Reports</h3>
                    <h1 id="stat-reports" style="margin: 0; color: #e11d48; font-size: 36px;">...</h1>
                </div>
            </div>

            <!-- 2. Daily Poll & Notice Manager -->
            <div style="display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;">
                
                <div class="modern-card" style="flex: 1; min-width: 300px; border-left: 5px solid #10b981;">
                    <h3 style="margin-top: 0; color: #10b981;">📊 Update Daily Poll</h3>
                    <input type="text" id="poll-question" placeholder="Poll Question" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 6px;">
                    <input type="text" id="poll-opt1" placeholder="Option A" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 6px;">
                    <input type="text" id="poll-opt2" placeholder="Option B" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 6px;">
                    <button id="update-poll-btn" style="background: #10b981; width: 100%;">Push Live Poll</button>
                </div>

                <div class="modern-card" style="flex: 1; min-width: 300px; border-left: 5px solid #f59e0b;">
                    <h3 style="margin-top: 0; color: #f59e0b;">📢 Global Campus Notice</h3>
                    <textarea id="notice-text" placeholder="Type emergency alert or campus update here..." style="width: 100%; height: 120px; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 6px; resize: none; font-family: inherit;"></textarea>
                    <button id="update-notice-btn" style="background: #f59e0b; width: 100%;">Update Notice Widget</button>
                </div>

            </div>

            <!-- 3. Moderation Queue (Reports) -->
            <div class="modern-card" style="border-top: 5px solid #e11d48;">
                <h3 style="margin-top: 0; color: #e11d48;">🚩 Moderation Queue (Reported Content)</h3>
                <div id="reports-list" style="display: flex; flex-direction: column; gap: 15px;">
                    <p style="color: gray;">Loading reports...</p>
                </div>
            </div>

        </main>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
